<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <main>
      <section class="main">
        <nav class="navbar">
          <label>
            <img src="logo.png" alt="4_yellow_hockey" />
            Studio
          </label>

          <ul>
            <li><a href="/index.html">Home</a></li>
            <li><a href="/index.html">About</a></li>
            <li><a href="/index.html">Services</a></li>
            <li><a href="/index.html">Contact</a></li>
          </ul>
        </nav>

        <div class="wrapper">
          <!-- LEFT SECTION -->
          <div class="left">
            <div class="card">
              <img src="/avatar.jpg" alt="man_dark_background" />

              <div class="data-wrapper">
                <div class="btn-parent">
                  <button>Follow</button>
                </div>

                <div class="personal">
                  <p class="name">
                    Celsior
                    <span>
                      <i class="ri-verified-badge-fill blue"></i>
                    </span>
                  </p>
                  <p class="profession">Product Designer</p>
                </div>

                <p class="des">
                  Celsior Luxe is a street wear brand where fashion levels up
                  like an overpowered anime protagonist and the blockchain is
                  just another playground for digital warriors.
                </p>

                <div class="count">
                  <p><span>300</span> Following</p>
                  <p><span>301.4K</span> Followers</p>
                </div>

                <div class="social">
                  <i class="ri-instagram-line"></i>
                  <i class="ri-twitter-x-line"></i>
                  <i class="ri-codepen-line"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT SECTION - FAQ -->
          <div class="right">
            
          </div>
        </div>
      </section>
      
    </main>
    
  </body>
</html>
